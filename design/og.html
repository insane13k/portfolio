<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Manrope:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#070A14;color:#E7EAF6;font-family:'Manrope',sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(60% 55% at 12% 0%,rgba(255,181,71,.16),transparent 65%),radial-gradient(45% 45% at 96% 8%,rgba(255,92,138,.16),transparent 65%)}
  svg{position:absolute;inset:0}
  .copy{position:absolute;left:84px;top:112px}
  .eyebrow{font:500 18px 'JetBrains Mono',monospace;letter-spacing:.16em;color:#FFB547;display:flex;align-items:center;gap:12px}
  .eyebrow i{width:11px;height:11px;border-radius:50%;background:#5EF0A0;box-shadow:0 0 14px #5EF0A0}
  h1{font:800 122px/.9 'Syne',sans-serif;letter-spacing:-.045em;margin:22px 0 26px}
  .role{font:600 34px 'Manrope',sans-serif}
  .role b{background:linear-gradient(90deg,#FFB547,#FF5C8A);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
  .sub{font:500 21px/1.35 'Manrope',sans-serif;color:#8F97B3;margin-top:18px;max-width:640px}
  .url{position:absolute;left:84px;bottom:44px;font:500 20px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#8F97B3}
  .url b{color:#FFB547;font-weight:500}
</style></head>
<body>
<div class="bg"></div>
<svg id="s" viewBox="0 0 1200 630" width="1200" height="630"></svg>
<div class="copy">
  <div class="eyebrow"><i></i>OPEN TO WORK · 2026</div>
  <h1>Aryan<br>Arora</h1>
  <div class="role">I build <b>web &amp; Android apps.</b></div>
  <div class="sub">Software engineer at Capgemini. Built and runs Protein Plate 2.0, a live food-delivery platform.</div>
</div>
<div class="url"><b>aryanarora13</b>.netlify.app</div>
<script>
// A still of the site's wireframe object: two nested icosahedra + a halo of points, projected onto the right side.
(function(){
  var svg=document.getElementById('s'), NS='http://www.w3.org/2000/svg';
  var cx=905, cy=318, R=225;
  function ico(r,ry,rx){ // vertices of an icosahedron, rotated by ry (y) and rx (x)
    var t=(1+Math.sqrt(5))/2, v=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]];
    var n=Math.sqrt(1+t*t);
    return v.map(function(p){ var x=p[0]/n*r,y=p[1]/n*r,z=p[2]/n*r;
      var x1=x*Math.cos(ry)+z*Math.sin(ry), z1=-x*Math.sin(ry)+z*Math.cos(ry);
      var y1=y*Math.cos(rx)-z1*Math.sin(rx), z2=y*Math.sin(rx)+z1*Math.cos(rx);
      return [x1,y1,z2]; });
  }
  var edges=[[0,11],[0,5],[0,1],[0,7],[0,10],[1,5],[5,11],[11,10],[10,7],[7,1],[3,9],[3,4],[3,2],[3,6],[3,8],[4,9],[2,4],[6,2],[8,6],[9,8],[4,5],[9,5],[2,11],[4,11],[6,10],[2,10],[8,7],[6,7],[9,1],[8,1]];
  function proj(p){ var d=1/(1+p[2]/(R*3.2)); return [cx+p[0]*d, cy+p[1]*d]; }
  function draw(r,ry,rx,color,op,w){
    var V=ico(r,ry,rx);
    edges.forEach(function(e){ var a=proj(V[e[0]]),b=proj(V[e[1]]); var l=document.createElementNS(NS,'line');
      l.setAttribute('x1',a[0]);l.setAttribute('y1',a[1]);l.setAttribute('x2',b[0]);l.setAttribute('y2',b[1]);
      l.setAttribute('stroke',color);l.setAttribute('stroke-opacity',op);l.setAttribute('stroke-width',w);svg.appendChild(l); });
  }
  // halo points
  for(var i=0;i<520;i++){ var th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), rr=R*1.32;
    var p=[rr*Math.sin(ph)*Math.cos(th), rr*Math.sin(ph)*Math.sin(th), rr*Math.cos(ph)]; var q=proj(p);
    var c=document.createElementNS(NS,'circle'); c.setAttribute('cx',q[0]); c.setAttribute('cy',q[1]); c.setAttribute('r',1.6); c.setAttribute('fill','#FFB547'); c.setAttribute('fill-opacity',.55+Math.random()*.4); svg.appendChild(c); }
  // core
  var core=document.createElementNS(NS,'circle'); core.setAttribute('cx',cx); core.setAttribute('cy',cy); core.setAttribute('r',R*.26); core.setAttribute('fill','#FFB547'); core.setAttribute('fill-opacity',.35); svg.appendChild(core);
  draw(R*.62,-0.9,0.35,'#FF5C8A',.85,2);
  draw(R,-0.5,0.2,'#FFB547',.75,2);
  // stars
  for(var j=0;j<160;j++){ var c2=document.createElementNS(NS,'circle'); c2.setAttribute('cx',Math.random()*1200); c2.setAttribute('cy',Math.random()*630); c2.setAttribute('r',Math.random()*1.1+.3); c2.setAttribute('fill','#FFB547'); c2.setAttribute('fill-opacity',.25+Math.random()*.4); svg.insertBefore(c2, svg.firstChild); }
})();
</script>
</body></html>
