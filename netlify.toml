# Static site: no build step, the repository root is published as-is.
[build]
  publish = "."
  # Explicit no-op: overrides the old "npm run build" still saved in the Netlify dashboard.
  command = "echo 'Static site - nothing to build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
