# Static site, no real build: the files are copied into dist/, the publish folder
# the Netlify project is already set up to deploy.
[build]
  publish = "dist"
  command = "rm -rf dist && mkdir dist && cp -r index.html styles.css script.js particles.js favicon.svg assets dist/ && if [ -f resume.pdf ]; then cp resume.pdf dist/; fi"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
